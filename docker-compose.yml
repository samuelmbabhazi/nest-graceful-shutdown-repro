# Non-default host ports, so the brokers do not collide with ones already running locally.
services:
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:16379:6379']
  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ['127.0.0.1:11883:1883']
  rabbitmq:
    image: rabbitmq:4-alpine
    ports: ['127.0.0.1:15673:5672']
  nats:
    image: nats:2-alpine
    ports: ['127.0.0.1:14222:4222']
